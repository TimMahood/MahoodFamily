name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/family.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/family.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret; the APK is signed with a throwaway debug key and Google sign-in will not match."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon :core:testDebugUnitTest

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MahoodFamily-0.1.${GITHUB_RUN_NUMBER}.apk"

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs out/*.apk | grep -E "SHA-1|DN"

      - uses: actions/upload-artifact@v4
        with:
          name: MahoodFamily-apk
          path: out/*.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Mahood Family 0.1.${{ github.run_number }}
          body: Install the APK on each phone (allow "install unknown apps" when asked).
          files: out/*.apk
